<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <form> 
          <center> <h1> Student Registration Form</h1> </center>
            <label for="text"> Full Name:</label> 

            <input type="text" name="text" id="text"
            Placeholder=" Enter your full name"> 
            <br><br>
            <label for="email"> Email:</label>
            <input type="email" name="email" id="email"
            placeholder="Enter Enter valid email address">
            <br><br>
            <label for="pass"> Password:</label>
            <input type="password" name="pass" id="password" placeholder=" Enter password">
            <br><br>
            <label> Gender:</label>
            <input type="radio" name="gender" id="male">
            <label for="Male"> male</label>
            <input type="radio" name="gender" id="female">
            <label for="female"> female</label>
            
            <input type="radio" name="gender" id="other">
             <label for="other"> other</label>
            <br><br>
            <label for="select"> Course:</label>
            <select id="select " name="course">
                <option value="select Course"> Select Course</option>
            <option value="B.tech"> B.tech</option>
            <option value="M.tech"> M.tech</option>
            <option value="BBA"> BBA</option>
            </select>
            <br><br>
            <label for="att"> Contact No:</label>
            <input type="number" name="att" id="att"
            placeholder=" Enter phone number">
            <br><br>
            
            <label for="add">Address:</label>
            <br>
            <textarea name="add" id="add"
            placeholder=" Enter your address">
            </textarea>
            
            <br><br>
            <input type="submit" value=" Register">
            <input type="reset" value="Clear">
            
            
            
        </form>
    </fieldset>
</body>
</html>
